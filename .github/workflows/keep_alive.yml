name: Keep-Alive Hugging Face Space

on:
  schedule:
    # Se ejecuta automáticamente cada 30 minutos (1,440 min/mes = 100% dentro del límite gratis de 2,000 min)
    - cron: '*/30 * * * *'
  workflow_dispatch: # Permite disparar la prueba manualmente desde GitHub Actions

jobs:
  ping-space:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Send Keep-Alive Ping to HF Space
        run: |
          STATUS=$(curl -k -s -L -o /dev/null -w "%{http_code}" --max-time 45 --connect-timeout 15 "https://axel785-kingdoom-whatsapp.hf.space/status.json")
          echo "HF Space Ping HTTP Status Code: $STATUS"
          if [ "$STATUS" -ge 200 ] && [ "$STATUS" -lt 400 ]; then
            echo "✅ Hugging Face Space respondió activamente ($STATUS)."
          else
            echo "⚠️ Aviso: HF Space respondió con status $STATUS"
          fi
