services:
  kingdoom-bot:
    build: .
    container_name: kingdoom-whatsapp-bot
    restart: unless-stopped
    ports:
      - "7860:7860"
    dns:
      - 8.8.8.8
      - 1.1.1.1
    environment:
      NODE_OPTIONS: "--dns-result-order=ipv4first --max-old-space-size=256"
    env_file: .env
    volumes:
      - ./wwebjs_auth:/app/.wwebjs_auth
    mem_limit: 1024m
    mem_reservation: 384m
    cpus: 1.8
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
