services:
  kingdoom-bot:
    build: .
    container_name: kingdoom-whatsapp-bot
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    ports:
      - "7860:7860"
    dns:
      - 8.8.8.8
      - 1.1.1.1
    environment:
      NODE_OPTIONS: "--dns-result-order=ipv4first --max-old-space-size=256"
    env_file: .env
    volumes:
      - ./wwebjs_auth:/app/.wwebjs_auth
    mem_limit: 1280m
    mem_reservation: 512m
    shm_size: 256m
    cpus: 1.8
    pids_limit: 256
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          node -e "require('http').get('http://127.0.0.1:7860/healthz', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 4m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
